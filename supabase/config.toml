# Supabase CLI configuration for local development and CI.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# The migrations/ and tests/ folders are generated copies of each module's SQL
# (packages/*/supabase). Edit the package files, then run `pnpm db:sync`.
project_id = "kitto"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "http://*.localhost:3000/**", "http://lvh.me:3000/**", "http://*.lvh.me:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
# Generous locally so e2e tests can send many magic links.
email_sent = 100

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"

# Both templates use token_hash links handled by /auth/confirm (see @kitto/auth).
# Hosted projects: paste supabase/templates/magic_link.html into
# Authentication > Emails for "Magic Link" and "Confirm signup" (docs/SETUP.md).
[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/magic_link.html"

# Local email viewer (Mailpit) at http://127.0.0.1:55324
[local_smtp]
enabled = true
port = 55324
