name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migration names are timestamped and unique
        run: |
          files=$(find packages tools apps -path '*/node_modules' -prune -o -path '*/supabase/migrations/*.sql' -print 2>/dev/null || true)
          bad=$(echo "$files" | xargs -r -n1 basename | grep -Ev '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then echo "Bad migration names:"; echo "$bad"; exit 1; fi
          dupes=$(echo "$files" | xargs -r -n1 basename | cut -c1-14 | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Duplicate migration timestamps: $dupes"; exit 1; fi

      - name: supabase/ is in sync with module SQL
        run: pnpm db:sync:check

      # Linux picks outbound ports from 32768-60999, which includes Supabase's
      # 553xx ports; move that range so image pulls can't take them first.
      - name: Keep Supabase ports free
        run: sudo sysctl -w net.ipv4.ip_local_port_range="61000 65000"
      - name: Start Postgres and apply migrations
        run: pnpm exec supabase db start

      - name: Re-apply from scratch (migrations are idempotent from empty)
        run: pnpm exec supabase db reset --local

      - name: Lint schema
        run: pnpm db:lint

      - name: pgTAP tests
        run: pnpm db:test

      - name: Generated types are up to date
        run: pnpm db:types:check

  web:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright + axe against local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Linux picks outbound ports from 32768-60999, which includes Supabase's
      # 553xx ports; move that range so image pulls can't take them first.
      - name: Keep Supabase ports free
        run: sudo sysctl -w net.ipv4.ip_local_port_range="61000 65000"
      # Auth (GoTrue), REST, Realtime and Mailpit are needed; skip the rest.
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Point the demo app at local Supabase
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_TENANT_MODE=path"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "MAILPIT_URL=${MAILPIT_URL:-http://127.0.0.1:55324}"
            echo "MPESA_ENV=mock"
            echo "MPESA_CALLBACK_BASE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - run: pnpm --filter @kitto/demo build
      - run: pnpm --filter @kitto/demo exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @kitto/demo test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/demo/playwright-report/
            apps/demo/test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
